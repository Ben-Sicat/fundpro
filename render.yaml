# Render blueprint for the processing service.
#
# Render rather than Vercel: this is a long-running FastAPI app that streams
# multi-megabyte workbooks through openpyxl, and it keeps an in-process store
# between requests. Neither fits a serverless function.
services:
  - type: web
    name: fundpro-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      # The bearer token the Next.js server sends. Generate once, then set the
      # SAME value as PREPROCESS_API_KEY in Vercel.
      - key: API_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      # Supabase SESSION pooler URI (port 5432, sslmode=require) — NOT the
      # transaction pooler, which cannot hold the long import transactions.
      #
      # `sync: false` means Render prompts for the value in the dashboard
      # instead of reading it from this file: the URI embeds the database
      # password and must never be committed.
      #
      # The password contains characters that are URI-significant (`@`, `/`,
      # `=`) and MUST be percent-encoded, or everything after the `@` is
      # parsed as the host and the connection fails with a confusing error.
      - key: SUPABASE_DB_URL
        sync: false
