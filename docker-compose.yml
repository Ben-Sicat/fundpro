# Local development Postgres 16 (matches the production engine version).
# Production may instead be Neon (serverless) — see DEPLOY.md. Keep both viable.
services:
  postgres:
    image: postgres:16-alpine
    container_name: fundpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundpro
      POSTGRES_PASSWORD: fundpro_dev_only
      POSTGRES_DB: fundpro
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundpro -d fundpro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
